name: CI

on:
  push:
    branches: [main]
  pull_request:

# Default for all jobs (CodeQL actions/missing-workflow-permissions). The `images` job
# declares its own broader grant, which overrides this.
permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    # gh-#581 N1: class-level cap — this job carries the ffmpeg retry loop's own worst-case
    # bound (~19 min, see the step below) on top of restore/build/test; observed healthy total
    # is 2-8 min. 30 gives headroom over that combined ceiling without riding the 360-min default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore GenWave.sln
      - name: Build (warnings are errors)
        run: dotnet build GenWave.sln --no-restore --configuration Release
      # T217 (SPEC F105.6, STORY-294): SEAMS.md is generated, never hand-edited — rebuild it from
      # the composition root's live DI registrations and byte-diff against the committed file (the
      # catalog index.json convention). MUST stay in THIS job, right after the build above: the
      # generator's content-root discovery bakes this runner's checkout paths into a build artifact
      # (MvcTestingAppManifest.json — see tools/check-seam-index.sh's own header), so a separate job
      # (even one restoring a cached build) is not guaranteed to resolve correctly. Also MUST run
      # BEFORE Test: Story294's own byte-diff fact has no Category trait and runs inside Test too —
      # a stale SEAMS.md reds that fact first and aborts the job, which would make this step's own
      # red path unreachable if it ran after Test.
      - name: SEAMS.md drift check
        run: ./tools/check-seam-index.sh
      # Integration tests need fixture-managed side containers (Postgres, Kokoro) — they run
      # on-demand on a dev box, not in CI (same policy as the pre-migration pipeline).
      # ffmpeg: the F88 artwork specs (Story222) drive the REAL binary — both fixture generation
      # and the extraction under test — matching the api image, which ships ffmpeg (gh-#105).
      # gh-#588: the retry loop itself lives in .github/actions/install-ffmpeg (was
      # inlined identically here, in release.yml, and in publish-nuget.yml).
      - name: Install ffmpeg (artwork specs drive the real binary)
        uses: ./.github/actions/install-ffmpeg
      - name: Test
        run: dotnet test GenWave.sln --no-build --configuration Release --filter "Category!=Integration"

  admin-ui:
    runs-on: ubuntu-latest
    # gh-#581 N1: observed 55s-1m13s across recent runs; no apt/ffmpeg dependency. 10 min is
    # generous headroom for npm registry flakiness without riding the 360-min default.
    timeout-minutes: 10
    defaults:
      run:
        working-directory: admin-ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin-ui/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      # gh-#553: `next lint` is a no-op under Next 16 (the CLI subcommand was removed) — this
      # runs the flat ESLint config (eslint.config.mjs) directly instead.
      - run: npm run lint
      # gh-#347: the main tsconfig excludes __specs__ (jest runs specs through next/jest's SWC
      # transform, which strips types without checking them) — this is the only step that actually
      # type-checks the spec suite.
      - run: npm run typecheck:specs
      - run: npx jest
      - run: npm run build
      # T170 guard: the composed theme sheet must override globals.css. Jest can't reproduce Next's
      # runtime CSS-precedence injection, so assert the real served <head> order (reuses the build
      # above). A Next/React upgrade that reorders precedence groups would otherwise silently strip
      # admin light-mode theming — green spec, broken page.
      - name: Theme stylesheet link-order guard (T170)
        run: bash scripts/check-theme-link-order.sh

  # DEPLOYMENT.md restates concrete compose.demo.yaml values (resource fence, model, pins) and
  # pin-bump commits touch only the compose file — this job fails the PR when they disagree
  # (gh-#77; the 3GB/6GB fence drift shipped unnoticed for two releases).
  doc-drift:
    runs-on: ubuntu-latest
    # gh-#581 N1: observed 4-7s (a single grep-class script); 5 min is enormous headroom, still
    # far below the 360-min default.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Check DEPLOYMENT.md against compose.demo.yaml
        run: ./tools/check-doc-drift.sh

  # Images publish only from main pushes; PRs prove they still build via the jobs above plus
  # the docker build here being cheap to re-verify locally. Tagged `home-*` per the runbook —
  # the Business edition's images will carry their own prefix elsewhere.
  # gh-#274: `home-latest` belongs to release.yml alone — it must always be the multi-arch
  # index a release publishes. This job pushes only `home-<sha>`, an amd64-only dev artifact;
  # tagging home-latest here would clobber the index back to single-arch on every merge.
  images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-test, admin-ui]
    runs-on: ubuntu-latest
    # gh-#581 N1: observed 2m52s-3m41s (four sequential docker build+push legs); 10 min is
    # ~3x headroom over the observed max, well below the 360-min default.
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build + push API image
        run: |
          docker build -f src/GenWave.Host/Dockerfile \
            --label org.opencontainers.image.source=https://github.com/GenWave-Org/genwave \
            --label org.opencontainers.image.description="GenWave Home control-plane API" \
            --label org.opencontainers.image.licenses=AGPL-3.0-only \
            -t ghcr.io/genwave-org/genwave:home-${{ github.sha }} \
            .
          docker push ghcr.io/genwave-org/genwave:home-${{ github.sha }}
      - name: Build + push Icecast image
        run: |
          docker build \
            --label org.opencontainers.image.source=https://github.com/GenWave-Org/genwave \
            --label org.opencontainers.image.description="GenWave Home Icecast fan-out" \
            --label org.opencontainers.image.licenses=AGPL-3.0-only \
            -t ghcr.io/genwave-org/genwave-icecast:home-${{ github.sha }} \
            ./icecast
          docker push ghcr.io/genwave-org/genwave-icecast:home-${{ github.sha }}
      # gh-#93: the admin UI image must publish alongside api/icecast or a --pinned demo box
      # silently runs whatever it built at first deploy. The admin-ui job (a `needs` of this one)
      # has already type-checked/tested the same tree; this build bakes the default
      # BACKEND_URL=http://api:8080 from admin-ui/Dockerfile, correct for every compose topology.
      - name: Build + push Admin UI image
        run: |
          docker build \
            --label org.opencontainers.image.source=https://github.com/GenWave-Org/genwave \
            --label org.opencontainers.image.description="GenWave Home admin UI" \
            --label org.opencontainers.image.licenses=AGPL-3.0-only \
            -t ghcr.io/genwave-org/genwave-admin-ui:home-${{ github.sha }} \
            ./admin-ui
          docker push ghcr.io/genwave-org/genwave-admin-ui:home-${{ github.sha }}
      # genwave.liq is bind-mounted at run time, not baked in — this image is the Liquidsoap
      # version pin + entrypoint.sh (see release.yml's matching step).
      - name: Build + push Engine image
        run: |
          docker build \
            --label org.opencontainers.image.source=https://github.com/GenWave-Org/genwave \
            --label org.opencontainers.image.description="GenWave Home Liquidsoap engine" \
            --label org.opencontainers.image.licenses=AGPL-3.0-only \
            -t ghcr.io/genwave-org/genwave-engine:home-${{ github.sha }} \
            ./engine
          docker push ghcr.io/genwave-org/genwave-engine:home-${{ github.sha }}

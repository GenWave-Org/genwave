name: Publish GenWave.Abstractions

# Tag-triggered pack + publish to nuget.org (runbook §4): tag `vX.Y.Z` → package version X.Y.Z.
# SourceLink is built into the .NET SDK (repo/commit metadata lands in the package automatically
# on CI builds); symbols ship as a .snupkg. A CycloneDX SBOM is attached as a run artifact and a
# license-blocker gate fails the publish on forbidden licenses (policy source: the license audit —
# the blocklist below is the enforceable subset).
#
# Publishing uses nuget.org TRUSTED PUBLISHING (OIDC) — no long-lived API key. Setup:
#   nuget.org → username menu → Trusted Publishing → new policy:
#     Repository Owner: GenWave-Org · Repository: genwave · Workflow File: publish-nuget.yml
#   Repo secret NUGET_USER = the nuget.org profile username (NOT an email).
# Note: on a PRIVATE repo the policy starts "temporarily active" for 7 days and deactivates if
# no publish happens in that window — re-activate it on nuget.org before the first tagged publish.

on:
  push:
    tags: ['v*']

jobs:
  pack-publish:
    runs-on: ubuntu-latest
    # gh-#581 N1: same ffmpeg retry-loop ceiling (~19 min worst case) as ci.yml's build-test, on
    # top of build/test/SBOM/license-gate/pack/publish; observed healthy total ~3 min.
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write   # GitHub OIDC token issuance for NuGet trusted publishing
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Derive version from tag
        run: echo "PKG_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # ffmpeg: the F88 artwork specs (Story222) drive the REAL binary (gh-#105) — same step
      # as ci.yml's build-test; this gate runs its own test pass and needs it too.
      - name: Install ffmpeg (artwork specs drive the real binary)
        shell: bash
        run: |
          # gh-#581: this step has wedged solid against the apt mirror three times (v5.2.2
          # release night x2, PR #586's CI — the #586 run's step measured 2003s before
          # cancel+rerun) — a silent stall (the known IPv6-to-mirror hang on GitHub-hosted
          # runners) with no self-imposed limit, so the runner sits "in_progress" for 30+
          # minutes until someone notices and cancels+reruns. Force IPv4 (the documented fix
          # for that stall), cap apt's own retry count and dpkg's lock wait, and wrap each
          # attempt in a hard `timeout` (with a kill-grace, so a wedge that ignores SIGTERM
          # still dies) so a wedge fails fast instead of hanging. Three attempts with a short
          # backoff, refreshing the package index each attempt in case the first handshake is
          # the one that's stuck.
          set -euo pipefail
          apt_opts=(-o Acquire::ForceIPv4=true -o Acquire::Retries=3 -o DPkg::Lock::Timeout=60)
          max_attempts=3
          attempt=1
          until [ "$attempt" -gt "$max_attempts" ]; do
            echo "Installing ffmpeg (attempt $attempt of $max_attempts)..."

            # A SIGTERM'd leg (our own timeout below, or a cancelled run) can leave dpkg mid
            # transaction with its lock held — clear that first so the next attempt fails on
            # the real mirror issue, not a stale lock it then mis-blames on the mirror.
            sudo dpkg --configure -a || true

            # Keep attempt 1 quiet (the common, healthy case); a recurrence needs the real apt
            # chatter to diagnose, not a second silent failure.
            quiet_opts=(-qq)
            if [ "$attempt" -gt 1 ]; then
              quiet_opts=()
            fi

            if timeout -k 10s 180s sudo apt-get update "${quiet_opts[@]}" "${apt_opts[@]}" \
              && timeout -k 10s 180s sudo apt-get install -y "${quiet_opts[@]}" --no-install-recommends "${apt_opts[@]}" ffmpeg; then
              echo "Installed ffmpeg."
              exit 0
            fi

            echo "Attempt $attempt failed or timed out against the apt mirror."
            attempt=$((attempt + 1))
            if [ "$attempt" -le "$max_attempts" ]; then
              sleep 5
            fi
          done
          echo "::error::All $max_attempts ffmpeg install attempts failed — this is the gh-#581 apt-mirror hang. Failing fast instead of wedging the runner; rerun the job."
          exit 1
      - name: Build + test first — never publish from a red tree
        run: |
          dotnet build GenWave.sln --configuration Release
          dotnet test GenWave.sln --no-build --configuration Release --filter "Category!=Integration"

      - name: SBOM (CycloneDX)
        run: |
          dotnet tool install --global CycloneDX
          dotnet-CycloneDX GenWave.sln -o sbom --json

      - name: License-blocker gate
        run: |
          # Fail on licenses the dual-license model cannot ship against. AGPL-3.0 is OUR license,
          # fine in our own tree; the gate watches third-party components pulled via NuGet.
          BLOCKLIST='SSPL|BUSL|GPL-2\.0-only|GPL-3\.0-only|Commons-Clause'
          if jq -r '.components[]?.licenses[]?.license?.id // empty' sbom/bom.json | grep -E "$BLOCKLIST"; then
            echo "::error::Blocked license detected in dependency SBOM — see license audit policy"
            exit 1
          fi
          echo "License gate clean."

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ env.PKG_VERSION }}
          path: sbom/bom.json

      - name: Pack
        run: |
          dotnet pack src/GenWave.Abstractions/GenWave.Abstractions.csproj \
            --configuration Release \
            --output packages \
            -p:Version=${PKG_VERSION} \
            -p:ContinuousIntegrationBuild=true \
            -p:IncludeSymbols=true \
            -p:SymbolPackageFormat=snupkg

      # Requested LAST — the temp key lives ~1 hour, so it must not sit through the build.
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to nuget.org
        run: |
          dotnet nuget push "packages/GenWave.Abstractions.${PKG_VERSION}.nupkg" \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

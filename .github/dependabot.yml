# Dependabot version updates (security *alerts* are a separate, always-on feature).
# Weekly cadence; nuget updates land in Directory.Packages.props (central package management).
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
    # Stay on .NET 10 LTS: skip .NET 11 (STS, same Nov 2028 end of support as 10). Only 11 is
    # skipped, so the .NET 12 LTS PRs (Nov 2027) arrive on their own as the cue to move.
    # Framework-aligned packages follow the TFM, so they move with it, never ahead of it.
    ignore:
      - dependency-name: "Microsoft.Extensions.*"
        versions: ["11.*"]
      - dependency-name: "Microsoft.AspNetCore.*"
        versions: ["11.*"]
      # Npgsql majors track .NET (11.0 needs Microsoft.Extensions.*.Abstractions 11, gh-#1036).
      - dependency-name: "Npgsql"
        versions: ["11.*"]
  - package-ecosystem: npm
    directory: /admin-ui
    schedule:
      interval: weekly
    labels: [dependencies]
    # The jest family is one release train: every jest package pins its siblings to the exact
    # same version (@jest/globals 30.5.1 demands @jest/expect 30.5.1), so a single-package bump
    # nests a second copy of the family under the bumped package and the spec typecheck loses
    # the jest-dom matcher augmentation (PR #682, 2026-09-04; the same rule bit the 29→30 move).
    # One grouped PR per train instead. ts-jest rides its own 29.x cadence and stays out.
    groups:
      jest:
        patterns:
          - "jest"
          - "@jest/*"
          - "jest-environment-*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
  - package-ecosystem: docker
    directory: /src/GenWave.Host
    schedule:
      interval: weekly
    labels: [dependencies]
    # Stay on .NET 10 LTS (see the nuget entry): skip the 11 images only (Bundler range syntax).
    ignore:
      - dependency-name: dotnet/sdk
        versions: ["~> 11.0"]
      - dependency-name: dotnet/aspnet
        versions: ["~> 11.0"]
  - package-ecosystem: docker
    directory: /icecast
    schedule:
      interval: weekly
    labels: [dependencies]
  # gh-#271: the liquidsoap pin (engine/Dockerfile FROM savonet/liquidsoap) is the one this
  # repo most needs watched. NOT covered by any entry here: icecast itself — a SHA-pinned
  # source tarball (icecast/Dockerfile ICECAST_TARBALL_URL), invisible to dependabot's docker
  # ecosystem; bumping it stays a manual edit of that ARG pair.
  - package-ecosystem: docker
    directory: /engine
    schedule:
      interval: weekly
    labels: [dependencies]
  - package-ecosystem: docker
    directory: /piper
    schedule:
      interval: weekly
    labels: [dependencies]
    # piper-tts needs onnxruntime, which ships wheels per Python minor; 3.15 had none and broke the
    # v5.16.0 release. Take Python minor bumps by hand once onnxruntime publishes the wheel.
    ignore:
      - dependency-name: python
        update-types: [version-update:semver-minor, version-update:semver-major]
  - package-ecosystem: docker
    directory: /admin-ui
    schedule:
      interval: weekly
    labels: [dependencies]

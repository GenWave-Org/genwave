# compose.yaml — single-station broadcast stack.
# One deployment == one radio station. Run a second station by deploying this stack again
# elsewhere with its own .env (MEDIA_DIR, STATION_NAME, ports). No proxy, no tenancy.
#
# Networks:
#   core  : api <-> engine <-> icecast <-> kokoro, and admin_ui -> api (app traffic).
#           cloudflared (profile "tunnel", off by default) also lives here so it can reach
#           api:8080/api:8081/admin_ui:3000 as tunnel ingress targets.
#   data  : api <-> db only (Postgres is invisible to engine/icecast/kokoro)
#   stats : api <-> dockerproxy only (gh-#148) — the Docker-socket proxy is invisible to every
#           other service, including everything on the public path (caddy/cloudflared/admin_ui);
#           same isolation idiom as `data` above.
#
# Security-critical rule: the engine's Liquidsoap control port (1234) is UNAUTHENTICATED.
# It is reachable inside the container network but is NEVER given a `ports:` mapping — Docker's
# network isolation is the firewall. To debug it, `docker compose exec engine bash` and talk to
# localhost:1234 from inside.
#
# Secrets come from a .env file (see .env.example). `${VAR:?}` fails the run loudly if unset.

name: genwave

networks:
  core: {}
  data: {}
  stats: {}

volumes:
  pgdata: {}
  tts: {}
  # ASP.NET Core Data Protection keys — persisted so the auth cookie survives api restarts
  dp_keys: {}
  # Authored safe-loop segments (F27) — api renders + writes, engine only ever plays (F11.12).
  # Kept separate from /media (F11.4): generated artifacts never enter the read-only library mount.
  authored: {}
  # Downloaded Piper voice model (SPEC F70.1, STORY-190) — persisted so a container restart
  # doesn't re-fetch it from huggingface.
  piper_models: {}
  # Alloy's WAL + Docker-tailing positions file (SPEC F78.1, STORY-202) — persisted so a
  # container restart resumes tailing where it left off instead of re-shipping from scratch.
  alloy_data: {}

services:
  db:
    image: postgres:16.4
    networks: [data]                          # NOT on core; no published ports
    environment:
      POSTGRES_DB: genwave
      POSTGRES_USER: genwave
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      LIBRARY_DB_PASSWORD: ${LIBRARY_DB_PASSWORD:?}    # the dedicated library_svc role (db/01-library.sh)
      STATION_DB_PASSWORD: ${STATION_DB_PASSWORD:?}   # the dedicated station_svc role (db/06-station-settings-migration.sh)
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/01-library.sh:/docker-entrypoint-initdb.d/01-library.sh:ro   # library schema + role on first boot
      - ./db/06-station-settings-migration.sh:/docker-entrypoint-initdb.d/06-station-settings-migration.sh:ro  # station schema + role on first boot
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U genwave -d genwave"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  icecast:
    build:
      context: ./icecast
    networks: [core]
    ports:
      - "8000:8000"                            # listener stream + Icecast status, direct on localhost
    environment:
      ICECAST_SOURCE_PASSWORD: ${ICECAST_SOURCE_PASSWORD:?}
      ICECAST_ADMIN_PASSWORD: ${ICECAST_ADMIN_PASSWORD:?}
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8000'"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  engine:
    build:
      context: ./engine                        # engine/Dockerfile extends savonet/liquidsoap:v2.4.4 with curl + entrypoint.sh
    networks: [core]                            # control port 1234 deliberately NOT published
    # No hard depends_on: api here — the entrypoint.sh fetches config with retries and falls back
    # to the GW_XFADE_* env vars below if the api is slow/down on a cold start. A strict
    # depends_on: api: service_healthy here would create a potential deadlock (api already depends
    # on icecast+engine being healthy for its own healthcheck path). Startup is tolerant by design.
    depends_on:
      icecast:
        condition: service_healthy              # connect the source to a live Icecast
    environment:
      ICECAST_SOURCE_PASSWORD: ${ICECAST_SOURCE_PASSWORD:?}
      STATION_NAME: ${STATION_NAME:-GWAV 108.8}   # same source as api's Station__Name — feeds icy-name + StreamTitle prefix
      # Fallback crossfade defaults: the entrypoint.sh fetches the effective values from the api
      # at boot (honouring any station.settings overlay). If the api is unreachable these env vars
      # are used as-is. applyMode=engine-restart: restart the engine container to apply an edit.
      GW_XFADE_MIN: "${GW_XFADE_MIN:-2}"
      GW_XFADE_MAX: "${GW_XFADE_MAX:-8}"
      # Inter-safe-track gap (F29.6/STORY-099/R4, gitea-#182). Read directly by genwave.liq via
      # environment.get — the entrypoint.sh fetch + station.settings overlay wiring is R5
      # (F19 allowlist); until then this compose default is the only source.
      # applyMode=engine-restart. 0 disables the gap.
      GW_SAFE_GAP_SECONDS: "${GW_SAFE_GAP_SECONDS:-7.0}"
    volumes:
      - ./engine/genwave.liq:/genwave.liq:ro
      - ${MEDIA_DIR:?}:/media:ro                # READ-ONLY: the engine plays, never writes
      - tts:/tts:ro                             # READ-ONLY: TTS audio clips generated by api/kokoro
      - authored:/authored:ro                   # READ-ONLY: authored safe-loop segments (F27, F11.12)
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/1234'"]  # control socket accepting?
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: src/GenWave.Host/Dockerfile
    networks: [core, data, stats]               # core -> engine, data -> db, stats -> dockerproxy
    ports:
      - "8080:8080"                             # control-plane API, direct on localhost
      - "8081:8081"                             # public spectator listener (SPEC F64.1/F64.2, STORY-172) —
                                                 # Standard mode wants LAN reachability, same as 8080; the
                                                 # demo/appliance topology (PLAN T19) instead reaches it only
                                                 # via Caddy on the core network.
    depends_on:
      db:
        condition: service_healthy              # schema must exist before first query
      engine:
        condition: service_healthy              # convenience; the feeder retries regardless
      kokoro:
        condition: service_healthy              # TTS service must be ready before api starts
    environment:
      # The library service owns the only DB access; it connects as the dedicated library_svc role
      # with its search_path pinned to the `library` schema.
      ConnectionStrings__Library: "Host=db;Database=genwave;Username=library_svc;Password=${LIBRARY_DB_PASSWORD:?};Search Path=library"
      ConnectionStrings__Station: "Host=db;Database=genwave;Username=station_svc;Password=${STATION_DB_PASSWORD:?};Search Path=station"
      # Single admin password for the Admin UI login. Empty = open API (local-dev convenience).
      Admin__Password: "${ADMIN_PASSWORD:-}"
      # Public listener (SPEC F64.1/F64.2, STORY-172): the app never force-binds a port — Kestrel
      # binds whatever ASPNETCORE_URLS lists, so :8081 is added alongside the existing :8080.
      # Spectator__PublicPort tells SurfaceGateMiddleware which local port is public-only: on it,
      # only the spectator surface + /health respond — admin, /media/*, /internal/* 404 regardless
      # of any other flag. Env/compose-only, deliberately not in the settings allowlist.
      ASPNETCORE_URLS: "http://+:8080;http://+:8081"
      Spectator__PublicPort: "8081"
      Liquidsoap__Host: engine
      Liquidsoap__Port: "1234"
      Liquidsoap__QueueId: "q"
      Loudness__TargetLufs: "-16"
      Loudness__CeilingDbtp: "-1"
      Library__MediaRoot: "/media"
      Library__ScanIntervalSeconds: "60"
      # How many files the ffmpeg analyzers enrich at once. The default is unchanged, but it is
      # now a variable (gh-#334): on a pinned appliance box compose.demo.yaml turns the admin
      # surface off, so PUT /api/settings — the live path this setting was built for (STORY-139)
      # — is unreachable, and a hardcoded value left an operator with no lever at all. The
      # piper-only overlay lowers the default; see its own note.
      Library__EnrichmentConcurrency: ${LIBRARY_ENRICHMENT_CONCURRENCY:-4}
      # Station identity (StationOptions — validated at startup)
      Station__Id: "genwave-1"
      Station__Name: ${STATION_NAME:-GWAV 108.8}  # shared with engine's STATION_NAME
      Station__Voice: "af_heart"
      Station__Scope__LibraryIds__0: "1"
      # TTS substrate (TtsOptions)
      Tts__Endpoint: "http://kokoro:8880"
      Tts__Format: "wav"
      Tts__RenderBudgetSeconds: "30"
      Tts__CacheRoot: "/tts"
      # TTS failover is opt-in (SPEC F99.2, F99.3, STORY-257) — the shipped default sets NEITHER
      # Tts__Fallback__Endpoint nor Tts__Fallback__Voice, so TtsFallbackChain.Resolve folds to
      # Empty and FallbackTtsSynthesizer is a transparent pass-through to Kokoro (gh-#147's
      # existing empty-chain semantics, now the default rather than an edge case). An operator who
      # wants Piper substitution opts in with BOTH halves: `--with fallback` (or
      # COMPOSE_PROFILES=fallback) to run the `piper` sidecar below (it carries
      # `profiles: ["fallback"]`, off by default), and a PUT /api/settings for
      # Tts:Fallback:Endpoint (live-editable, StationSettingsAllowlist — no restart needed). The
      # piper-only topology (compose.piper-only.yaml) does not use this mechanism at all: there
      # Piper is the PRIMARY engine (SPEC F99.4), never a fallback hop.
      # Icecast admin-stats listener count (SPEC F62.12 addendum, STORY-179, gitea-#10). Env/compose-
      # only, deliberately absent from StationSettingsAllowlist — Icecast__AdminPassword is a secret
      # (F19.3), never readable or writable through the settings API.
      Icecast__StatsUrl: http://icecast:8000
      Icecast__AdminPassword: ${ICECAST_ADMIN_PASSWORD:?}
      # Container stats for the Health page (gh-#148): the socket-proxy sidecar's base URL on the
      # `stats` network. Env/compose-only, deliberately absent from StationSettingsAllowlist —
      # deployment topology, never a live PUT. No depends_on: dockerproxy — when the sidecar is
      # down GET /api/health/containers degrades (degraded: true + empty list), never 500s, so a
      # missing proxy can never hold the broadcast hostage at startup.
      DockerStats__BaseUrl: "http://dockerproxy:2375"
    volumes:
      - ${MEDIA_DIR:?}:/media:ro                # READ-ONLY: the library scans + analyses, never writes
      - tts:/tts                                # READ-WRITE: api writes TTS clips here for engine to play
      - dp_keys:/var/lib/genwave/dp-keys        # READ-WRITE: ASP.NET Core Data Protection key ring
      - authored:/authored                      # READ-WRITE: api renders authored safe-loop segments (F27, F11.12)
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:v0.6.0   # PIN — do not use latest
    networks: [core]                                    # internal only; control port 8880 NEVER published
    # kokoro-fastapi leaks RSS under load (upstream #453 fixed in v0.3.0; #262 still open as of
    # v0.6.0). Fresh baseline is ~1.2GiB, the leaked baseline creeps toward the cap, and one
    # long render can spike ~+0.5GiB on top (live-observed on demo 2026-07-28..30: MEMCG kills
    # 30h apart at light load, 88min apart in a heavy render window — gh-#276). The cap stays
    # as the fail-closed backstop: kernel OOM-kills the container, `restart: unless-stopped`
    # brings it back clean in seconds, music never stops. But since personas the failed render
    # retries via Piper and airs in the WRONG VOICE, so the cap sets how often that happens —
    # 4g = spike headroom above the leaked baseline instead of a daily ceiling bump.
    mem_limit: 4g
    healthcheck:
      # HTTP-level check against kokoro-fastapi's dedicated /health route (upstream v0.6.0+, the
      # pin above; curl ships in the image). The old TCP-connect idiom wrote a bare newline into
      # uvicorn's socket, which logged `WARNING: Invalid HTTP request received.` every interval
      # (~720 lines/h of noise) — and only proved the port was open, not that the app served.
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8880/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  piper:
    # Repo-built (gh-#241): the artibex/piper-http digest this service used to pin is amd64-only
    # (single-arch manifest, re-verified 2026-07-29) and wraps an UNPINNED git clone of the
    # now-archived rhasspy/piper. piper/ owns the image instead — pinned piper-tts (the maintained
    # piper1-gpl line) behind a stdlib HTTP wrapper that preserves the artibex wire shape exactly:
    # POST text/plain -> / -> WAV bytes (PiperTtsSynthesizer), OPTIONS answered quietly (gh-#64,
    # PiperHealthProbe), same MODEL_DOWNLOAD_LINK/SPEAKER env contract, same port 5000. Published
    # multi-arch per release as ghcr.io/genwave-org/genwave-piper (gh-#240 matrix); the demo
    # overlay pins that image like every other repo-built service (gh-#93 posture).
    #
    # profiles (SPEC F99.3, STORY-257): off by default — a station with no fallback configured
    # does not run this container. Same documented-profile-gate idiom compose.piper-only.yaml's
    # own header explains for kokoro/ollama (plain profile assignment over a service-removal merge
    # tag, since only attribute-level `!override`/`!reset` is trusted at this repo's Compose
    # floor). Enable with `--with fallback` (or COMPOSE_PROFILES=fallback) — see the api service's
    # Tts__Fallback__Endpoint comment above for the second, config half of opting in. The
    # piper-only overlay resets this back to unconditional (`profiles: !reset []`): there Piper is
    # the PRIMARY engine (F99.4), not an opt-in fallback, so it must always run on that topology.
    profiles: ["fallback"]
    build:
      context: ./piper
    networks: [core]                                    # internal only; no host ports
    environment:
      # Downloads this ONNX voice model (+ its .onnx.json config) to /app/models on first boot
      # (persisted in the piper_models volume below) and serves it for the container's lifetime —
      # must match whatever Tts:Fallback:Voice (or the piper-only overlay's own posture) an
      # operator expects this sidecar to be speaking with (en_US-lessac-medium, documentation only
      # — see TtsFallbackProfile.Voice's schema remarks for why it is never sent on the wire).
      MODEL_DOWNLOAD_LINK: "https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/en/en_US/lessac/medium/en_US-lessac-medium.onnx?download=true"
      SPEAKER: "0"
    volumes:
      - piper_models:/app/models
    # CPU-only min-spec: the onnx runtime + a "medium" quality voice model comfortably fits well
    # under 1GiB; a hard cap here is the same fail-closed backstop as kokoro's above, just sized
    # to Piper's much smaller footprint.
    mem_limit: 768m
    healthcheck:
      # Plain TCP-connect check, same idiom as icecast/engine above. The repo-built server only
      # opens port 5000 AFTER the voice model is downloaded and loaded (piper/server.py), so a
      # connect success here means "ready to render", not merely "process exists".
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/5000'"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 60s   # first boot downloads the voice model from huggingface
    restart: unless-stopped

  admin_ui:
    build:
      context: ./admin-ui
    profiles: ["admin"]                           # F61.4/STORY-166: Appliance/Headless boxes clear
                                                   # COMPOSE_PROFILES in .env so no Node runtime runs;
                                                   # Operator/Standard's default .env keeps it enabled.
    networks: [core]                             # reaches the api over the core network
    ports:
      - "3000:3000"                              # Admin UI, direct on localhost
    environment:
      # The Next.js rewrite proxies /api/* to the C# backend (same-origin in the browser → no CORS).
      BACKEND_URL: "http://api:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, not localhost: Next.js standalone binds IPv4-only, but busybox wget resolves
      # `localhost` to ::1 (IPv6) first → connection refused. Hit the address it actually listens on.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  cloudflared:
    # OPTIONAL, versioned Cloudflare Tunnel (Q3 housekeeping: this previously ran OUTSIDE the
    # repo as unmanaged infrastructure with zero observability). Off by default — profiles:
    # ["tunnel"] — enable with COMPOSE_PROFILES=admin,tunnel (or just `tunnel` on a headless
    # box) once TUNNEL_TOKEN is set. See DEPLOYMENT.md "Cloudflare tunnel (optional)" for setup
    # (creating the tunnel/token in the Cloudflare dashboard) and the observability contract
    # (readiness, metrics, alerting posture).
    image: cloudflare/cloudflared:2026.7.2   # PIN — `docker manifest inspect` verified 2026-07-20
    profiles: ["tunnel"]
    networks: [core]                          # reaches api:8080/api:8081/admin_ui:3000 as ingress targets
    command: ["tunnel", "--no-autoupdate", "--metrics", "0.0.0.0:2000", "run"]
    environment:
      # Every other secret in this file uses `${VAR:?}` (fail loudly at render time) — that idiom
      # does NOT work here: compose interpolates every service's environment unconditionally
      # before filtering by profile, so a `:?` on this line breaks `docker compose config`
      # even with the "tunnel" profile inactive (verified: `error while interpolating
      # services.cloudflared.environment.TUNNEL_TOKEN: required variable ... is missing a
      # value`, thrown on the default profile-off render with no --profile flag at all). So this
      # stays `:-` (empty default), and the fail-closed behaviour instead comes from cloudflared
      # itself: an empty or invalid TUNNEL_TOKEN makes the container exit immediately with a
      # clear log line ("cloudflared tunnel run" requires the ID or name of the tunnel... /
      # "Provided Tunnel token is not valid.") — verified empirically against this pinned image.
      # `restart: unless-stopped` then crash-loops it visibly in `docker compose ps`/`logs`
      # rather than silently running without a tunnel.
      TUNNEL_TOKEN: "${TUNNEL_TOKEN:-}"
    # No `ports:` — /ready and /metrics stay network-internal, same posture as the engine's
    # control port above. To probe from the host for ad-hoc debugging, opt in locally (never
    # commit this): add `ports: ["127.0.0.1:2000:2000"]`.
    healthcheck:
      # This image is distroless — no shell, no wget/curl (`docker run --rm --entrypoint sh
      # cloudflare/cloudflared:2026.7.2` fails with "executable file not found in $PATH",
      # verified against this pinned tag). cloudflared ships its own readiness probe instead:
      # `cloudflared tunnel ready` calls the local metrics server's /ready endpoint and returns
      # the matching exit code, so exec form (CMD, not CMD-SHELL) needs no shell either. Verified
      # live against this image: exits 1 before the tunnel registers a connection, exits 0 once
      # /ready reports a connected tunnel (readyConnections >= 1).
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:2000", "ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    mem_limit: 128m   # real footprint is ~20-30MiB idle; generous headroom, same backstop idiom as above
    restart: unless-stopped

  alloy:
    # OPTIONAL log shipper (SPEC F78.1/F78.3/F78.4/F78.5, STORY-202, PLAN T49) — tails every
    # genwave container's stdout/stderr and pushes to Loki (observability/alloy/config.alloy
    # owns the pipeline; observability/LABELS.md owns the label contract). Off by default —
    # profiles: ["logging"] — enable with COMPOSE_PROFILES=admin,logging (or just `logging` on
    # a headless box) once LOKI_PUSH_URL is set.
    image: grafana/alloy:v1.18.0   # PIN — `docker manifest inspect` + `docker pull` verified 2026-07-21
    profiles: ["logging"]
    networks: [core]
    # Read-only docker.sock carve-out #1 (SPEC F78.2) — one of exactly two services in this file
    # that may mount it (the other is dockerproxy below, gh-#148), and only read-only.
    # tools/check-compose-socket.sh pins both shut across every profile combination this repo
    # renders; see that script's header for the full rationale.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy/data   # WAL + Docker-tailing positions file
    environment:
      # Every other secret in this file uses `${VAR:?}` (fail loudly at render time) — that
      # idiom does NOT work here, same F77.4/cloudflared TUNNEL_TOKEN rationale: compose
      # interpolates every service's environment unconditionally before filtering by profile,
      # so a `:?` on any of these would break `docker compose config` even with the "logging"
      # profile inactive. So these stay `:-` (empty default); the fail-closed guarantee instead
      # comes from this service's own entrypoint below refusing to start on an empty push URL.
      LOKI_PUSH_URL: "${LOKI_PUSH_URL:-}"
      LOKI_ACCESS_CLIENT_ID: "${LOKI_ACCESS_CLIENT_ID:-}"
      LOKI_ACCESS_CLIENT_SECRET: "${LOKI_ACCESS_CLIENT_SECRET:-}"
      # Label contract (SPEC F78.3, observability/LABELS.md): this deployment's `station`/`env`
      # identity. Sensible bare-launch defaults — a from-source `docker compose up` with no .env
      # entries for these still ships clearly-a-dev-box labels rather than failing to start.
      ALLOY_STATION_LABEL: "${ALLOY_STATION_LABEL:-genwave}"
      ALLOY_ENV_LABEL: "${ALLOY_ENV_LABEL:-dev}"
    # No `ports:` — the debug/readiness HTTP server binds 127.0.0.1 only inside the container
    # (Alloy's own default), same posture as the engine's control port above.
    #
    # Fail-loud on an empty push URL (SPEC F78.4): verified empirically against this pinned
    # image that Alloy does NOT do this itself — `loki.write`'s `endpoint.url` is validated
    # lazily (Go's net/url.Parse accepts "" and any scheme-less string without error), so
    # `alloy run` with LOKI_PUSH_URL="" starts cleanly and just never ships anything, silently.
    # Only a genuinely MISSING required attribute fails `alloy run` at load — and the Alloy
    # config language has no ternary/conditional-include to omit `url` only when the env var is
    # empty (confirmed: `cond ? a : b` is a parse error). So the config can't fail loud on its
    # own; this entrypoint override is the fail-closed guarantee instead — refuses to exec Alloy
    # at all when LOKI_PUSH_URL is empty, exiting 1 immediately (verified: `docker compose
    # --profile logging run --rm --no-deps alloy` with it empty exits 1 in under a second, never
    # runs silently without shipping).
    entrypoint:
      - bash
      - -c
      - |
        set -euo pipefail
        if [ -z "$${LOKI_PUSH_URL:-}" ]; then
          echo "alloy: LOKI_PUSH_URL is empty -- refusing to start without a Loki push target (SPEC F78.4)." >&2
          exit 1
        fi
        exec alloy run /etc/alloy/config.alloy --storage.path=/var/lib/alloy/data
    healthcheck:
      # This image ships bash + sh but no curl/wget (`docker run --rm --entrypoint sh
      # grafana/alloy:v1.18.0 -c 'command -v curl wget'` finds neither, verified against this
      # pinned tag — F77.3 precedent: never assume a shell has an HTTP client). Alloy's own
      # readiness endpoint is plain HTTP with no dedicated CLI probe subcommand (unlike
      # cloudflared's `tunnel ready`), so bash's `/dev/tcp` pseudo-device stands in as the HTTP
      # client: open the socket, write a raw GET, grep the response body for Alloy's exact ready
      # phrase. This image's /-/ready DOES have a real not-ready window: 503 "Alloy is not
      # ready." before the HTTP server's internal readiness flips, then 200 "Alloy is ready."
      # once it does (verified live against this pinned image). A bare `grep -qi ready` matches
      # BOTH bodies — "Alloy is not ready." still contains "ready" as a substring — so it would
      # report healthy while Alloy is still not ready. Discriminating on the contiguous phrase
      # "is ready" instead rejects "Alloy is not ready." (no "is ready" substring there, only
      # "is not ready") and matches only "Alloy is ready.".
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/12345; printf \"GET /-/ready HTTP/1.0\\r\\n\\r\\n\" >&3; grep -qi \"is ready\" <&3'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    mem_limit: 256m   # generous headroom for a single-daemon log-tailing sidecar; same backstop idiom as above
    restart: unless-stopped

  dockerproxy:
    # Container stats for the admin Health page (gh-#148): tecnativa's HAProxy-based socket proxy
    # in front of /var/run/docker.sock, allowlisted down to container reads. The api never touches
    # the socket itself — it asks this proxy over the `stats` network for GET /containers/json +
    # GET /containers/{id}/stats?stream=false (+ inspect for health/restart count), and HAProxy
    # 403s every path the env grants below don't name. This is read-only carve-out #2 for
    # docker.sock (after alloy's above) — tools/check-compose-socket.sh pins both shut.
    image: tecnativa/docker-socket-proxy:v0.4.2   # PIN — pulled + allowlist probed live 2026-07-29.
                                                   # v0.5.0 was pushed 2 days before this pin; not
                                                   # soaked — re-verify and bump deliberately.
    networks: [stats]                              # api <-> dockerproxy ONLY. Not on core: nothing
                                                   # on the public path (caddy/cloudflared/admin_ui)
                                                   # has a route to it — same posture as db on `data`.
    environment:
      # The ONLY grant: the /containers section (list, inspect, one-shot stats). Everything else
      # stays HAProxy's default-deny, and POST defaults to 0 so even the granted section is
      # read-only — no start/stop/create through this proxy, ever. Verified live against this
      # pinned tag 2026-07-29: /containers/json 200; /images/json, /info, POST /containers/create,
      # POST /containers/{id}/stop all 403. (EVENTS/PING/VERSION are the image's default-on
      # read-only trio; PING serves the healthcheck below.)
      CONTAINERS: "1"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro   # READ-ONLY — the whole point of the sidecar
    # No `ports:` — never host-published; the admin UI reads stats through the api
    # (GET /api/health/containers, AdminOnly), never this proxy directly.
    healthcheck:
      # /_ping is HAProxy answering from the default-on PING section — proves the proxy is up and
      # routing, no grant needed. busybox wget ships in this image (verified against this pinned
      # tag 2026-07-29; no curl, no bash); 127.0.0.1 not localhost, same rule as admin_ui above.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:2375/_ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    mem_limit: 64m   # one HAProxy process; same backstop idiom as cloudflared/alloy above
    restart: unless-stopped

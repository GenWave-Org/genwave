# Disposable Kokoro TTS container for the Host integration tests (run on-demand; not the SDK-only CI).
# The KokoroFixture brings this up (--wait) and tears it down (down -v).
# The host port is ephemeral (loopback-only) and the compose project name comes from the fixture's
# per-run -p flag (gh-#602): a fixed name:/port pair let two concurrent runs destroy each other's
# container, exactly the #569 DatabaseFixture collision one suite over.

services:
  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:v0.6.0
    ports:
      - "127.0.0.1::8880"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8880/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 30s

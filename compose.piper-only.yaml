# =============================================================================
# compose.piper-only.yaml — the low-memory / no-kokoro overlay (gh-#242, from the
# gh-#213 Raspberry Pi spike).
#
#   docker compose -f compose.yaml -f compose.piper-only.yaml up -d
#   ./launch.sh --piper-only              # dev flow
#   ./launch.sh --pinned --piper-only     # appliance flow (this file merged LAST)
#
# What it does on top of compose.yaml (and, when stacked, compose.demo.yaml):
#   * removes the kokoro service — its ~1.2GiB fresh baseline is the single biggest
#     resident in the stack, and a 4GB box (Raspberry Pi 4, small VPS) can't afford it
#   * drops api's hard `depends_on: kokoro: service_healthy` (keeps db/engine), so the
#     api boots without any kokoro container existing at all
#   * resets the piper service's `profiles: ["fallback"]` gate (base compose.yaml, SPEC F99.3)
#     back to unconditional — on THIS topology piper is not an opt-in fallback, it is the
#     PRIMARY engine (SPEC F99.4, STORY-257), so it must always run
#   * seeds `Tts:PiperPrimaryEndpoint` so every on-air render goes straight to Piper as the
#     primary engine — no fallback chain to lean on (F99.1's "right voice or no speech" is
#     satisfied directly: a Piper failure drops the break, exactly like a Kokoro failure does
#     on the default topology's own empty-chain pass-through)
#
# The default experience is untouched: this file is opt-in via -f (never auto-loaded),
# and kokoro deliberately does NOT sit behind a profile in compose.yaml — profiles
# default off, which would silently flip every existing box to no-kokoro on upgrade.
#
# Why `profiles:` here instead of removing the service outright: the Compose
# Specification's merge docs define `!reset`/`!override` for ATTRIBUTES only — removing
# a whole service via `kokoro: !reset null` renders correctly on current Compose
# (verified v5.0.2, 2026-07-29) but is documented nowhere, so it can't be trusted at
# this repo's v2.24+ floor (DEPLOYMENT.md/HARDWARE.md). Assigning a profile that
# nothing ever activates uses plain, documented profile semantics instead: the service
# is absent from `docker compose config`, `up`, and `pull` on every profile set this
# repo runs (admin/tunnel/logging — verified: `config --services` lists no kokoro).
# Never add "disabled-by-piper-only" to COMPOSE_PROFILES — activating it while this
# overlay's depends_on reset is in force would run kokoro with nothing routing to it.
#
# Requires Docker Compose v2.24+ (the `!override` merge tag) — same floor as
# compose.demo.yaml.
# =============================================================================

services:
  kokoro:
    # See the header for why this is a profile assignment, not a service removal. The
    # profile name is deliberately self-describing and activated by nothing in this repo.
    profiles: ["disabled-by-piper-only"]

  # gh-#310 — the LLM pair, disabled by the same mechanism. HARDWARE.md topology (a)
  # (the RECOMMENDED Pi shape) says "playout + piper-only, NO LLM (templated patter, by
  # design)" and prescribes this overlay, but until now the demo overlay's ollama rode
  # along underneath it: llama3.2:3b held permanently resident (OLLAMA_KEEP_ALIVE: -1,
  # right for the 16GB demo box, ~2-2.5GiB of RSS forever on a Pi), behind a 6144M fence
  # LARGER than a 4GB box's entire RAM, with ollama-init pulling ~2GB of weights on first
  # boot. This file's own header explains the overlay exists because a 4GB box cannot
  # afford kokoro's ~1.2GiB — while shipping an always-resident model twice that size.
  #
  # The two MUST travel together: ollama-init's `depends_on: ollama` would name a
  # profile-disabled service and fail the whole render, the same trap the api/kokoro
  # comment below describes. Nothing else depends on either (gh-#242 pinned api's
  # depends_on to db+engine), so no reset is needed beyond this pair.
  #
  # Declaring a service that exists only in compose.demo.yaml is safe in the dev flow
  # (compose.yaml + this file, no demo layer): an inactive profile excludes the block
  # before Compose ever asks it for an image — verified against v5.0.2, and pinned by a
  # gh-#310 spec that renders BOTH stacks.
  #
  # The api's own LLM path needs no change: Llm:Endpoint defaults to "" (LlmOptions'
  # documented disabled state, F34.2), which short-circuits to the template writer with
  # no HTTP attempt at all. A box that HAS saved an Llm:Endpoint settings row keeps it —
  # a DB row overrides an env default, the same DEPLOYMENT.md Station:SpectatorMode-class
  # gotcha the api block's own environment comments below describe — and degrades through
  # Docker-DNS NXDOMAIN to templated patter, exactly as HARDWARE.md topology (a) describes.
  ollama:
    profiles: ["disabled-by-piper-only"]

  ollama-init:
    profiles: ["disabled-by-piper-only"]

  piper:
    # `!reset`, not a plain mapping merge: base compose.yaml's `profiles: ["fallback"]` (SPEC
    # F99.3) would otherwise MERGE with anything set here (Compose unions sequence-typed
    # attributes like `profiles` across -f files, verified against v5.0.2 — a plain
    # `profiles: []` here changes nothing, the base list survives untouched). On THIS topology
    # piper is not an opt-in fallback — it is the PRIMARY engine (SPEC F99.4, STORY-257) — so
    # the gate must come off entirely, the same `!override`/`!reset`-for-attributes idiom the
    # api block below already uses for `depends_on`.
    profiles: !reset []

  api:
    # `!override`, not a plain mapping merge: compose merges `depends_on` by KEY across
    # -f files, so a plain block here would keep the base kokoro condition right
    # alongside these — and a depends_on naming a profile-disabled service fails the
    # whole render ("service \"api\" depends on undefined service \"kokoro\": invalid
    # compose project", verified 2026-07-29). The kokoro block above and this reset
    # must always travel together.
    depends_on: !override
      db:
        condition: service_healthy              # schema must exist before first query
      engine:
        condition: service_healthy              # convenience; the feeder retries regardless
    environment:
      # Piper as the PRIMARY engine (SPEC F99.4, STORY-257), not a fallback hop pinned by kind:
      # TtsServiceCollectionExtensions selects PiperPrimaryTtsSynthesizer as
      # FallbackTtsSynthesizer's primary whenever this key is set, so EVERY render — every
      # SegmentKind, and every kind-less caller (safe-loop authoring, admin preview) alike —
      # goes straight to Piper. This superseded the old per-kind Tts:EngineByKind seed
      # (STORY-191): pinning every kind to a Piper FALLBACK hop while the primary stayed Kokoro
      # was a chain-shaped workaround for what this key now states directly. (Crosstalk, the
      # eighth kind — SPEC F127.1, T281 — needs no entry here for the same reason: the primary
      # serves every kind, present and future, with no per-kind map to maintain.)
      Tts__PiperPrimaryEndpoint: "http://piper:5000"
      # gh-#334 — enrichment halved, by the same reasoning as the kokoro and LLM removals above.
      # This overlay exists because a 4GB/4-core box cannot afford the default topology, and the
      # ffmpeg analyzers are the heaviest sustained load GenWave produces: base compose's 4 pins
      # every core of a Pi 5 (measured: api at 378% of 400%, SoC at 83.4°C — past the 80°C soft
      # limit — and the 5V rail dipping into undervoltage every ~2 min, one dip per analyzed file).
      # HARDWARE.md already prescribes 2 for Pi boxes; nothing enforced it, and on a pinned box
      # nothing could — compose.demo.yaml turns Admin:Enabled off, so PUT /api/settings (the live
      # STORY-139 path) is unreachable there.
      #
      # Same variable as base compose, lower default: an operator who sets
      # LIBRARY_ENRICHMENT_CONCURRENCY still wins, on either stack. Enrichment is a backfill, not a
      # broadcast dependency — halving it slows first-boot catalog build and never touches playout.
      Library__EnrichmentConcurrency: ${LIBRARY_ENRICHMENT_CONCURRENCY:-2}
      # ⚠️ Same seeding shape as compose.demo.yaml's Station__* overrides: an env
      # default (GET /api/settings reports source="default") that a row saved in the
      # settings DB OVERRIDES — the DEPLOYMENT.md Station:SpectatorMode gotcha, same
      # class. Tts:PiperPrimaryEndpoint is deliberately absent from StationSettingsAllowlist
      # (deploy-time topology, never a live PUT — see TtsOptions.PiperPrimaryEndpoint's own
      # remarks), so there is no DB-row precedence gotcha for it specifically to chase; a
      # stale Tts:EngineByKind row left over from a pre-STORY-257 box is harmless here too —
      # the empty-chain short-circuit (no Tts:Fallback:Profiles/Endpoint on this topology
      # either) skips the per-kind lookup entirely before it would ever be consulted.
      #
      # Tts__Endpoint deliberately STAYS pointed at the absent kokoro host (the base compose
      # value) rather than being repointed at piper: KokoroTtsSynthesizer speaks
      # kokoro-fastapi's `POST /v1/audio/speech`, piper's http server speaks
      # `POST text/plain -> /`, so KokoroHealthProbe/KokoroVoiceLister/KokoroTtsSynthesizer
      # would misbehave against a repointed value (piper/server.py's do_GET answers ANY path
      # 200, so a repointed KokoroHealthProbe would report Kokoro falsely HEALTHY — worse than
      # today's honest NXDOMAIN failure). That dead hostname is fully quarantined to those
      # three Kokoro-shaped clients now — the actual TTS render path never touches it: every
      # render (kind-carrying or not) goes straight to Piper via Tts:PiperPrimaryEndpoint
      # above, with no NXDOMAIN dance and no cached-verdict wait involved. GET /api/voices
      # still degrades to 502 ProblemDetails (Kokoro's own voice list, unreachable); the
      # broadcast never depends on it.

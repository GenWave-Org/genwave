<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GenWave — Spectator</title>
  <!-- Absolute paths, not relative: the page is served at /spectator (no trailing slash), so a
       relative "styles.css"/"app.js" would resolve against the URL's parent (RFC 3986 — the last
       path segment is replaced, not treated as a directory) and 404. -->
  <link rel="icon" href="/spectator/favicon.ico" />
  <link rel="stylesheet" href="/spectator/styles.css" />
  <!-- Composed active-theme sheet (STORY-264, SPEC F102.3, PLAN T160/T162). Linked AFTER
       styles.css deliberately, not incidentally: a composed :root is (0,1,0) and TIES the
       static :root above on specificity, so "composed wins" holds only via this load order
       (PLAN T162's hard precondition — the dark blocks win on specificity regardless of
       order, but the light block does not). If this sheet is slow, fails, or 404s, the
       static sheet above already carries the shipped default's full token set, so the page
       degrades to default Wireless rather than going unstyled (SPEC F102.7). -->
  <link rel="stylesheet" href="/spectator/theme.css" id="theme-stylesheet" />
  <!-- Same-origin, external (script-src 'self', gh-#180 — no inline handler anywhere on this
       page). Deliberately NOT deferred, unlike app.js below: it must run before <body> exists so
       the light/dark MODE cookie (genwave-mode, independent of the theme-slug cookie above) can
       stamp data-theme on <html> before first paint. There is no server render to stamp it into
       here the way admin-ui's layout.tsx does — the earliest possible client script is the next
       best thing. Everything that touches <body> content — including the GET
       /spectator/api/themes read that populates the switcher's <select> (SPEC F102.10a) — waits
       for DOMContentLoaded; see the file's own remarks. -->
  <script src="/spectator/switcher.js"></script>
</head>
<body>
  <div class="shell">
    <header class="masthead">
      <div class="masthead__row">
        <div class="masthead__identity">
          <p class="eyebrow">GenWave</p>
          <h1 class="wordmark" id="station-name">GenWave</h1>
        </div>
        <!-- The page's FIRST interactive chrome (STORY-266): a theme (palette) picker plus a
             light/dark mode toggle. All behaviour lives in switcher.js — no inline handler here,
             no inline styling anywhere on the page (style-src 'self'/script-src 'self', gh-#180).
             The picker below starts empty; switcher.js populates it from GET
             /spectator/api/themes once the DOM is ready. -->
        <div class="theme-switcher" id="theme-switcher">
          <label class="visually-hidden" for="theme-select">Theme</label>
          <select id="theme-select" class="theme-switcher__select" aria-label="Theme"></select>
          <button
            type="button"
            id="mode-toggle"
            class="theme-switcher__mode"
            aria-label="Switch to dark theme"
            aria-pressed="false"
          >
            <svg class="theme-switcher__icon theme-switcher__icon--sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.5" />
              <g stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
                <line x1="12" y1="2.5" x2="12" y2="5" />
                <line x1="12" y1="19" x2="12" y2="21.5" />
                <line x1="2.5" y1="12" x2="5" y2="12" />
                <line x1="19" y1="12" x2="21.5" y2="12" />
                <line x1="5.1" y1="5.1" x2="6.9" y2="6.9" />
                <line x1="17.1" y1="17.1" x2="18.9" y2="18.9" />
                <line x1="5.1" y1="18.9" x2="6.9" y2="17.1" />
                <line x1="17.1" y1="6.9" x2="18.9" y2="5.1" />
              </g>
            </svg>
            <svg class="theme-switcher__icon theme-switcher__icon--moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path
                d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5z"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linejoin="round"
              />
            </svg>
          </button>
        </div>
      </div>
    </header>

    <section class="card now-playing" id="now-playing" aria-live="polite">
      <span class="now-playing__dot" id="now-playing-dot" aria-hidden="true"></span>
      <!-- Decorative alongside title/artist/dj text below — alt="" is deliberate, not an
           omission. Default src is the station mark (the card-sized logo.png, not the 32px
           favicon — gh-#258): the "loading" appearance before the first now-playing poll
           resolves, and the fallback renderArt() always leaves in place when a track carries
           no artworkUrl (T126, SPEC F93.3). -->
      <img class="now-playing__art" id="now-playing-art" src="/spectator/logo.png" alt="" />
      <div class="now-playing__body">
        <p class="now-playing__kicker" id="now-playing-kicker">Loading…</p>
        <h2 class="now-playing__title" id="now-playing-title"></h2>
        <p class="now-playing__artist" id="now-playing-artist"></p>
        <!-- The DJ card (SPEC F129.3, STORY-335, PLAN T299) — face + name + show, replacing the
             pre-F129 plain "with {name}" text line. Host-only for v1: the payload's dj/djAvatarUrl
             already name the SCHEDULED host regardless of a crosstalk exchange airing underneath
             (see app.js's own renderDjCard remarks) — crosstalk guest attribution is a RECORDED
             DEFERRAL, nothing this markup needs to special-case. -->
        <div class="dj-card" id="dj-card" hidden>
          <span class="dj-card__avatar">
            <!-- Faceless/load-error placeholder shown first, hidden once (if ever) a real
                 djAvatarUrl loads successfully — see initDjAvatarFallback()'s own remarks. Same
                 microphone glyph the admin Personas page uses for "no face set"
                 (PersonaFace.tsx's own PersonaFacePlaceholder) — one placeholder style across
                 both surfaces. -->
            <svg
              class="dj-card__avatar-placeholder"
              id="dj-card-avatar-placeholder"
              viewBox="0 0 16 16"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <rect x="6" y="1.6" width="4" height="7" rx="2" />
              <path d="M4 7.5a4 4 0 0 0 8 0" />
              <line x1="8" y1="11.5" x2="8" y2="14" />
              <line x1="5.5" y1="14" x2="10.5" y2="14" />
            </svg>
            <img class="dj-card__avatar-img" id="dj-card-avatar-img" alt="" hidden />
          </span>
          <span class="dj-card__text">
            <span class="dj-card__name" id="dj-card-name"></span>
            <span class="dj-card__show" id="dj-card-show"></span>
          </span>
        </div>
        <!-- Deploy-skew stub (PLAN T299 fix round): the pre-F129 element id an already-cached
             app.js (a returning browser that has not yet refetched app.js post-deploy) still
             dereferences unguarded — without this hidden stub, that stale script's TypeError on a
             missing element freezes the WHOLE now-playing panel for up to app.js's own 300s
             browser-cache TTL. Never populated by the current app.js; remove after the release
             following v5.1.0's successor ships. -->
        <p class="now-playing__dj" id="now-playing-dj" hidden></p>
        <div class="now-playing__meta" id="now-playing-meta" hidden>
          <div class="progress" id="progress" hidden>
            <div class="progress__fill" id="progress-fill"></div>
          </div>
          <p class="now-playing__clock" id="now-playing-clock"></p>
        </div>
        <p class="now-playing__upnext" id="now-playing-upnext" hidden></p>
      </div>
    </section>

    <section class="card" aria-labelledby="listen-heading">
      <h2 class="section-title" id="listen-heading">Listen live</h2>
      <audio id="player" class="player" controls preload="none" aria-label="GenWave live stream" hidden></audio>
      <p class="hint" id="player-hint" hidden>Stream not configured.</p>
      <p class="hint" id="listener-count" aria-live="polite" hidden></p>
    </section>

    <!-- Hidden by default: shown only once the one-shot about fetch confirms requestsEnabled
         (SPEC F87.11, STORY-229, PLAN T92). Absence when disabled is deliberate — the same
         silence as POST /spectator/api/requests' own 404, not a disabled-state message. -->
    <section class="card" id="request-section" aria-labelledby="request-heading" hidden>
      <h2 class="section-title" id="request-heading">Request a song</h2>
      <form class="request-form" id="request-form">
        <label class="request-label" for="request-wish">What do you want to hear?</label>
        <div class="request-row">
          <!-- maxlength mirrors Requests:WishMaxLength's default (140) — a client-side courtesy
               only; the server enforces the real, operator-configurable cap. No `required`: a
               picker-only request (gh-#131) is legal — the submit handler enforces "at least one
               of text/genre/mood" instead. -->
          <input
            type="text"
            id="request-wish"
            name="wish"
            class="request-input"
            maxlength="140"
            autocomplete="off"
            placeholder="Artist or song title"
          />
          <button type="submit" class="request-submit">Send</button>
        </div>
        <!-- Optional pickers (gh-#131), populated from /spectator/api/request-options — blank
             default; the blank option submits nothing for that predicate. -->
        <div class="request-pickers">
          <label class="request-picker">
            <span class="request-picker__label">Genre</span>
            <select id="request-genre" name="genre" class="request-input request-select">
              <option value="">Any genre</option>
            </select>
          </label>
          <label class="request-picker">
            <span class="request-picker__label">Mood</span>
            <select id="request-mood" name="mood" class="request-input request-select">
              <option value="">Any mood</option>
            </select>
          </label>
        </div>
      </form>
      <p class="request-message" id="request-message" aria-live="polite" role="status"></p>
    </section>

    <section class="card" aria-labelledby="history-heading">
      <h2 class="section-title" id="history-heading">Recently played</h2>
      <ul class="history" id="history-list"></ul>
    </section>

    <section class="card" aria-labelledby="stats-heading">
      <h2 class="section-title" id="stats-heading">Catalog</h2>
      <dl class="stats" id="stats-grid"></dl>
    </section>

    <section class="card" aria-labelledby="about-heading">
      <h2 class="section-title" id="about-heading">About</h2>
      <dl class="about" id="about-grid"></dl>
    </section>

    <footer class="footer">
      <p>GenWave — your self-hosted AI DJ internet radio.</p>
    </footer>
  </div>
  <script src="/spectator/app.js" defer></script>
</body>
</html>

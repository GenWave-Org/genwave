<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GenWave — Spectator</title>
  <!-- Absolute paths, not relative: the page is served at /spectator (no trailing slash), so a
       relative "styles.css"/"app.js" would resolve against the URL's parent (RFC 3986 — the last
       path segment is replaced, not treated as a directory) and 404. -->
  <link rel="icon" href="/spectator/favicon.ico" />
  <link rel="stylesheet" href="/spectator/styles.css" />
</head>
<body>
  <div class="shell">
    <header class="masthead">
      <p class="eyebrow">GenWave</p>
      <h1 class="wordmark" id="station-name">GenWave</h1>
    </header>

    <section class="card now-playing" id="now-playing" aria-live="polite">
      <span class="now-playing__dot" id="now-playing-dot" aria-hidden="true"></span>
      <!-- Decorative alongside title/artist/dj text below — alt="" is deliberate, not an
           omission. Default src is the station mark (the card-sized logo.png, not the 32px
           favicon — gh-#258): the "loading" appearance before the first now-playing poll
           resolves, and the fallback renderArt() always leaves in place when a track carries
           no artworkUrl (T126, SPEC F93.3). -->
      <img class="now-playing__art" id="now-playing-art" src="/spectator/logo.png" alt="" />
      <div class="now-playing__body">
        <p class="now-playing__kicker" id="now-playing-kicker">Loading…</p>
        <h2 class="now-playing__title" id="now-playing-title"></h2>
        <p class="now-playing__artist" id="now-playing-artist"></p>
        <p class="now-playing__dj" id="now-playing-dj" hidden></p>
        <div class="now-playing__meta" id="now-playing-meta" hidden>
          <div class="progress" id="progress" hidden>
            <div class="progress__fill" id="progress-fill"></div>
          </div>
          <p class="now-playing__clock" id="now-playing-clock"></p>
        </div>
        <p class="now-playing__upnext" id="now-playing-upnext" hidden></p>
      </div>
    </section>

    <section class="card" aria-labelledby="listen-heading">
      <h2 class="section-title" id="listen-heading">Listen live</h2>
      <audio id="player" class="player" controls preload="none" aria-label="GenWave live stream" hidden></audio>
      <p class="hint" id="player-hint" hidden>Stream not configured.</p>
      <p class="hint" id="listener-count" aria-live="polite" hidden></p>
    </section>

    <!-- Hidden by default: shown only once the one-shot about fetch confirms requestsEnabled
         (SPEC F87.11, STORY-229, PLAN T92). Absence when disabled is deliberate — the same
         silence as POST /spectator/api/requests' own 404, not a disabled-state message. -->
    <section class="card" id="request-section" aria-labelledby="request-heading" hidden>
      <h2 class="section-title" id="request-heading">Request a song</h2>
      <form class="request-form" id="request-form">
        <label class="request-label" for="request-wish">What do you want to hear?</label>
        <div class="request-row">
          <!-- maxlength mirrors Requests:WishMaxLength's default (140) — a client-side courtesy
               only; the server enforces the real, operator-configurable cap. No `required`: a
               picker-only request (gh-#131) is legal — the submit handler enforces "at least one
               of text/genre/mood" instead. -->
          <input
            type="text"
            id="request-wish"
            name="wish"
            class="request-input"
            maxlength="140"
            autocomplete="off"
            placeholder="Artist or song title"
          />
          <button type="submit" class="request-submit">Send</button>
        </div>
        <!-- Optional pickers (gh-#131), populated from /spectator/api/request-options — blank
             default; the blank option submits nothing for that predicate. -->
        <div class="request-pickers">
          <label class="request-picker">
            <span class="request-picker__label">Genre</span>
            <select id="request-genre" name="genre" class="request-input request-select">
              <option value="">Any genre</option>
            </select>
          </label>
          <label class="request-picker">
            <span class="request-picker__label">Mood</span>
            <select id="request-mood" name="mood" class="request-input request-select">
              <option value="">Any mood</option>
            </select>
          </label>
        </div>
      </form>
      <p class="request-message" id="request-message" aria-live="polite" role="status"></p>
    </section>

    <section class="card" aria-labelledby="history-heading">
      <h2 class="section-title" id="history-heading">Recently played</h2>
      <ul class="history" id="history-list"></ul>
    </section>

    <section class="card" aria-labelledby="stats-heading">
      <h2 class="section-title" id="stats-heading">Catalog</h2>
      <dl class="stats" id="stats-grid"></dl>
    </section>

    <section class="card" aria-labelledby="about-heading">
      <h2 class="section-title" id="about-heading">About</h2>
      <dl class="about" id="about-grid"></dl>
    </section>

    <footer class="footer">
      <p>GenWave — your self-hosted AI DJ internet radio.</p>
    </footer>
  </div>
  <script src="/spectator/app.js" defer></script>
</body>
</html>

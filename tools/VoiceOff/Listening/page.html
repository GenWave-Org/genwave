<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Listening cards</title>
<style>
:root {
  --bg: #f6efe3; --surface: #fdf8ee; --surface-2: #efe5d2; --line: #ddd0b8;
  --ink: #2b2320; --mute: #706256; --accent: #b94f29; --accent-ink: #fdf8ee; --accent-2: #6f632f;
  --danger: #a63325; --star: #c98a12;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1e1713; --surface: #2a211b; --surface-2: #241c16; --line: #3f342a;
    --ink: #f0e7d8; --mute: #a89a88; --accent: #d96a3d; --accent-ink: #1e1713; --accent-2: #b3a25e;
    --danger: #e06a55; --star: #e8b23a;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 1rem/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
}
main { max-width: 40rem; margin: 0 auto; padding: 1rem; }
h1 { font-size: 1.35rem; margin: 1rem 0 .25rem; }
h2 { font-size: 1.05rem; margin: 1.5rem 0 .25rem; }
ol { list-style: none; margin: 0; padding: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 1rem; margin: .75rem 0; }
.card.dragging { opacity: .45; }
.head { display: flex; align-items: center; gap: .75rem; }
.rank { font-size: 1.4rem; font-weight: 700; min-width: 1.6rem; text-align: center; color: var(--accent-2); font-variant-numeric: tabular-nums; }
.title { flex: 1; min-width: 0; margin: 0; font-weight: 600; overflow-wrap: anywhere; }
.moves { display: flex; gap: .25rem; }
.label { font-size: .7rem; letter-spacing: .14em; text-transform: uppercase; color: var(--accent-2); margin: .75rem 0 .25rem; }
.mute { color: var(--mute); }
.badge { display: inline-block; font-size: .75rem; border: 1px solid var(--line); border-radius: 3px; padding: 0 .4rem; margin-left: .35rem; background: var(--surface-2); font-weight: 400; }
.why { margin: .5rem 0 0; }
.facts { display: grid; grid-template-columns: max-content 1fr; gap: .15rem .75rem; margin: .5rem 0 0; font-size: .9rem; }
.facts dt { color: var(--mute); }
.facts dd { margin: 0; overflow-wrap: anywhere; }
.row { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; }
button, textarea {
  font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line);
  border-radius: 6px; min-height: 44px; padding: .4rem .8rem;
}
button { cursor: pointer; }
button:focus-visible, textarea:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button:disabled { opacity: .5; cursor: default; }
.handle { cursor: grab; min-width: 44px; padding: .4rem; touch-action: none; }
.step { min-width: 44px; padding: .4rem; }
.player { display: flex; align-items: center; gap: .5rem; margin: .75rem 0 0; }
.player > button { flex: 0 0 6rem; background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.player > input[type="range"] { flex: 1; min-height: 44px; padding: 0; border: 0; background: none; accent-color: var(--accent); }
.time { margin: 0; font-size: .9rem; color: var(--mute); font-variant-numeric: tabular-nums; }
.winces output { min-width: 2.5rem; text-align: center; font-size: 1.2rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.stars button { border: 0; background: none; font-size: 1.7rem; line-height: 1; min-width: 44px; padding: 0; color: var(--mute); }
.stars button[aria-pressed="true"] { color: var(--star); }
textarea { width: 100%; min-height: 5rem; resize: vertical; }
#status { margin: 0; font-size: .9rem; position: sticky; top: 0; background: var(--bg); padding: .35rem 0; }
.error { color: var(--danger); font-weight: 600; }
.tray .card { border-style: dashed; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>Listening cards</h1>
  <p class="mute">Put the best card at the top. Every change is saved on its own.</p>
  <p id="status" class="mute" role="status" aria-live="polite"></p>
  <p id="error" class="error" role="alert" hidden></p>

  <ol id="cards" aria-label="Rendered cards, best first"></ol>

  <section id="tray" class="tray" hidden>
    <h2>Did not render</h2>
    <p class="mute">These cards have no recording. They are kept so nothing goes missing.</p>
    <ol id="tray-cards"></ol>
  </section>
</main>

<template id="card-template">
  <li class="card" data-role="card">
    <div class="head">
      <button type="button" class="handle" data-role="handle" draggable="true" aria-label="Drag to reorder. With this focused, press the up or down arrow key to move the card.">&#x2630;</button>
      <span class="rank" data-role="rank"></span>
      <p class="title" data-role="title"></p>
      <div class="moves">
        <button type="button" class="step" data-role="move-up" aria-label="Move this card up">&#x25B2;</button>
        <button type="button" class="step" data-role="move-down" aria-label="Move this card down">&#x25BC;</button>
      </div>
    </div>
    <p class="why" data-role="why"></p>
    <dl class="facts" data-role="facts"></dl>

    <div class="player">
      <button type="button" data-role="play">Play</button>
      <input type="range" min="0" max="1000" value="0" data-role="seek" aria-label="Position in this recording">
    </div>
    <p class="time" data-role="time"></p>
    <audio preload="metadata" data-role="audio"></audio>

    <p class="label">Winces</p>
    <div class="row winces">
      <button type="button" class="step" data-role="wince-down" aria-label="One fewer wince">&minus;</button>
      <output data-role="wince-count" aria-live="polite">0</output>
      <button type="button" class="step" data-role="wince-up" aria-label="One more wince">+</button>
    </div>

    <p class="label">Stars</p>
    <div class="row stars" data-role="stars" role="group" aria-label="Star rating"></div>

    <p class="label">Notes</p>
    <textarea data-role="notes" maxlength="2000" rows="3" aria-label="Notes about this card"></textarea>
  </li>
</template>

<template id="tray-template">
  <li class="card" data-role="tray-card">
    <p class="title" data-role="title"></p>
    <dl class="facts" data-role="facts"></dl>
  </li>
</template>

<script>
(function () {
  "use strict";

  const SAVE_DELAY_MS = 500;
  const MAX_STARS = 5;

  /** Rendered cards in display order, each { id, node, entry }. */
  const rendered = [];
  let saveTimer = null;
  let inFlight = 0;
  let dirty = false;
  let dragged = null;
  /** Saved judgements of cards that did not render: carried into every save so a save never wipes them. */
  const kept = { order: [], cards: {} };

  const byId = (id) => document.getElementById(id);
  const role = (node, name) => node.querySelector('[data-role="' + name + '"]');
  const fromTemplate = (id) => byId(id).content.firstElementChild.cloneNode(true);

  function setStatus(text, isError) {
    const status = byId("status");
    status.textContent = text;
    status.classList.toggle("error", Boolean(isError));
  }
  function fail(message) { const e = byId("error"); e.textContent = message; e.hidden = false; }
  function clearError() { byId("error").hidden = true; }

  // ---- Facts (every string comes from /state and goes in through textContent) ----

  function addFact(list, name, value) {
    const dt = document.createElement("dt");
    dt.textContent = name;
    const dd = document.createElement("dd");
    dd.textContent = value;
    list.append(dt, dd);
  }
  const yesNo = (flag) => (flag ? "Yes" : "No");
  const listText = (items) => (Array.isArray(items) && items.length > 0 ? items.join(", ") : "None");

  function describe(card) {
    const details = card.details;
    if (!details) { return card.id; }
    return details.engine + " – " + details.title;
  }

  function fillFacts(list, card) {
    const d = card.details;
    addFact(list, "Card", card.id);
    addFact(list, "Render host", card.host);
    if (!d) { addFact(list, "Card file", "Missing"); return; }
    const f = d.facts;
    addFact(list, "Voice", d.voice + " at speed " + d.speed);
    addFact(list, "Checkpoint", f.checkpoint);
    addFact(list, "Voices", String(f.voices));
    addFact(list, "Cloning", yesNo(f.cloning));
    addFact(list, "Makes its own voice", yesNo(f.ownVoice));
    addFact(list, "Cannot express", listText(f.cannot));
    addFact(list, "Tricks used", listText(f.tricks));
    if (d.variantOf) { addFact(list, "Variant of", d.variantOf); }
  }

  // ---- Player: one toggle, a seek bar and a time line; starting one clip stops every other ----

  function stopAudio(keep) {
    document.querySelectorAll("audio").forEach((a) => { if (a !== keep) { a.pause(); } });
  }
  function clock(seconds) {
    if (!isFinite(seconds) || seconds < 0) { return "-:--"; }
    const s = Math.floor(seconds);
    return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
  }
  function wirePlayer(audio, button, seek, time) {
    const playText = button.textContent;
    let seeking = false;
    function update() {
      const length = audio.duration;
      if (!seeking) { seek.value = isFinite(length) && length > 0 ? String(Math.round(audio.currentTime / length * 1000)) : "0"; }
      time.textContent = isFinite(length)
        ? clock(audio.currentTime) + " of " + clock(Math.ceil(length)) + " (" + clock(Math.ceil(length - audio.currentTime)) + " left)"
        : "Length shows once it loads.";
    }
    button.addEventListener("click", () => {
      if (!audio.paused) { audio.pause(); return; }
      stopAudio(audio);
      const started = audio.play();
      if (started && started.catch) {
        started.catch((e) => {
          // A pause that lands before play() settles rejects it with AbortError: that is the user's own stop.
          if (!e || e.name !== "AbortError") { fail("The recording could not be played. Try again."); }
        });
      }
    });
    seek.addEventListener("pointerdown", () => { seeking = true; });
    ["pointerup", "pointercancel", "change"].forEach((type) => {
      seek.addEventListener(type, () => { seeking = false; update(); });
    });
    seek.addEventListener("input", () => {
      if (isFinite(audio.duration)) { audio.currentTime = Number(seek.value) / 1000 * audio.duration; }
    });
    audio.addEventListener("play", () => { button.textContent = "Pause"; });
    audio.addEventListener("pause", () => { button.textContent = playText; });
    audio.addEventListener("ended", () => { audio.currentTime = 0; update(); });
    ["loadedmetadata", "durationchange", "timeupdate", "emptied"].forEach((type) => audio.addEventListener(type, update));
    update();
  }

  // ---- Judgement: the whole document is sent on every change ----

  function snapshot() {
    const cards = Object.assign({}, kept.cards);
    rendered.forEach((r) => { cards[r.id] = { winces: r.entry.winces, stars: r.entry.stars, notes: r.entry.notes }; });
    return { savedAt: new Date().toISOString(), order: rendered.map((r) => r.id).concat(kept.order), cards: cards };
  }

  function changed() {
    dirty = true;
    setStatus("Saving.", false);
    clearTimeout(saveTimer);
    saveTimer = setTimeout(save, SAVE_DELAY_MS);
  }

  function save(keepalive) {
    clearTimeout(saveTimer);
    saveTimer = null;
    if (!dirty) { return; }
    // A normal save waits for the one in flight (its completion resends); a keepalive save leaves now with the newest snapshot.
    if (inFlight > 0 && keepalive !== true) { return; }
    inFlight += 1;
    dirty = false;
    fetch("/judgement", {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(snapshot()),
      keepalive: keepalive === true,
    }).then((r) => {
      if (!r.ok) { throw new Error("status " + r.status); }
      inFlight -= 1;
      // A change made while this save was in flight is sent next.
      if (dirty) { clearTimeout(saveTimer); saveTimer = setTimeout(save, SAVE_DELAY_MS); }
      else if (inFlight === 0) { setStatus("Saved.", false); }
    }).catch(() => {
      // Local state is kept; the next change sends everything again.
      inFlight -= 1;
      dirty = true;
      setStatus("Not saved. It will be tried again on your next change.", true);
    });
  }

  function flush() { if (dirty) { save(true); } }

  // ---- Ordering ----

  function renumber() {
    rendered.forEach((r, i) => {
      role(r.node, "rank").textContent = String(i + 1);
      role(r.node, "move-up").disabled = i === 0;
      role(r.node, "move-down").disabled = i === rendered.length - 1;
    });
  }

  /** Takes the order from where the nodes sit in the page. */
  function syncOrderFromDom() {
    const position = (r) => Array.prototype.indexOf.call(byId("cards").children, r.node);
    rendered.sort((a, b) => position(a) - position(b));
    renumber();
  }

  function moveBy(item, delta) {
    const index = rendered.indexOf(item);
    const target = index + delta;
    if (target < 0 || target >= rendered.length) { return; }
    const list = byId("cards");
    if (delta < 0) { list.insertBefore(item.node, rendered[target].node); }
    else { list.insertBefore(item.node, rendered[target].node.nextSibling); }
    syncOrderFromDom();
    role(item.node, "handle").focus();
    changed();
    setStatus("Moved to place " + (rendered.indexOf(item) + 1) + ".", false);
  }

  function wireDrag(item) {
    const handle = role(item.node, "handle");
    let originalNext = null;
    handle.addEventListener("dragstart", (event) => {
      dragged = item;
      originalNext = item.node.nextSibling;
      item.node.classList.add("dragging");
      event.dataTransfer.effectAllowed = "move";
      event.dataTransfer.setData("text/plain", item.id);
      event.dataTransfer.setDragImage(item.node, 20, 20);
    });
    handle.addEventListener("dragend", (event) => {
      item.node.classList.remove("dragging");
      dragged = null;
      if (event.dataTransfer && event.dataTransfer.dropEffect === "none") {
        // Escape, or a drop outside the list: the card goes back where it was and nothing is saved.
        byId("cards").insertBefore(item.node, originalNext);
        syncOrderFromDom();
        return;
      }
      const before = rendered.map((r) => r.id).join("|");
      syncOrderFromDom();
      if (rendered.map((r) => r.id).join("|") !== before) { changed(); }
    });
    handle.addEventListener("keydown", (event) => {
      if (event.key === "ArrowUp") { event.preventDefault(); moveBy(item, -1); }
      else if (event.key === "ArrowDown") { event.preventDefault(); moveBy(item, 1); }
    });
    role(item.node, "move-up").addEventListener("click", () => moveBy(item, -1));
    role(item.node, "move-down").addEventListener("click", () => moveBy(item, 1));
  }

  function wireDropTarget(list) {
    list.addEventListener("dragover", (event) => {
      if (!dragged) { return; }
      event.preventDefault();
      event.dataTransfer.dropEffect = "move";
      // Land before the first other card whose middle is below the pointer, else at the end.
      const others = rendered.filter((r) => r !== dragged);
      const next = others.find((r) => {
        const box = r.node.getBoundingClientRect();
        return event.clientY < box.top + box.height / 2;
      });
      const anchor = next ? next.node : null;
      if (dragged.node.nextSibling !== anchor && dragged.node !== anchor) { list.insertBefore(dragged.node, anchor); }
    });
    list.addEventListener("drop", (event) => { event.preventDefault(); });
  }

  // ---- Controls of one card ----

  function paintStars(item) {
    const group = role(item.node, "stars");
    let i = 0;
    for (const button of group.children) {
      button.setAttribute("aria-pressed", item.entry.stars !== null && i < item.entry.stars ? "true" : "false");
      i += 1;
    }
    group.setAttribute("aria-label", item.entry.stars === null ? "Stars: not rated" : "Stars: " + item.entry.stars + " of " + MAX_STARS);
  }

  function wireControls(item) {
    const count = role(item.node, "wince-count");
    const paintCount = () => { count.textContent = String(item.entry.winces); };
    role(item.node, "wince-down").addEventListener("click", () => {
      if (item.entry.winces > 0) { item.entry.winces -= 1; paintCount(); changed(); }
    });
    role(item.node, "wince-up").addEventListener("click", () => { item.entry.winces += 1; paintCount(); changed(); });
    paintCount();

    const group = role(item.node, "stars");
    for (let n = 1; n <= MAX_STARS; n += 1) {
      const star = document.createElement("button");
      star.type = "button";
      star.textContent = "★";
      star.setAttribute("aria-label", n === 1 ? "1 star" : n + " stars");
      star.addEventListener("click", () => {
        // Choosing the star already chosen clears the rating.
        item.entry.stars = item.entry.stars === n ? null : n;
        paintStars(item);
        changed();
      });
      group.appendChild(star);
    }
    paintStars(item);

    const notes = role(item.node, "notes");
    notes.value = item.entry.notes;
    notes.addEventListener("input", () => { item.entry.notes = notes.value; changed(); });
  }

  // ---- Building the page from /state ----

  function entryFor(judgement, id, notesLimit) {
    const saved = judgement && judgement.cards ? judgement.cards[id] : null;
    const winces = saved && Number.isInteger(saved.winces) && saved.winces >= 0 ? saved.winces : 0;
    const stars = saved && Number.isInteger(saved.stars) && saved.stars >= 1 && saved.stars <= MAX_STARS ? saved.stars : null;
    const notes = saved && typeof saved.notes === "string" ? saved.notes.slice(0, notesLimit) : "";
    return { winces: winces, stars: stars, notes: notes };
  }

  function buildCard(card, judgement) {
    const node = fromTemplate("card-template");
    const item = { id: card.id, node: node, entry: entryFor(judgement, card.id, role(node, "notes").maxLength) };
    role(node, "title").textContent = describe(card);
    if (card.details && card.details.asShipped) {
      const badge = document.createElement("span");
      badge.className = "badge";
      badge.textContent = "As shipped";
      role(node, "title").appendChild(badge);
    }
    const why = role(node, "why");
    why.textContent = card.details ? card.details.why : "";
    why.hidden = !card.details;
    fillFacts(role(node, "facts"), card);

    const audio = role(node, "audio");
    audio.src = "/clips/" + encodeURIComponent(card.id) + ".wav";
    wirePlayer(audio, role(node, "play"), role(node, "seek"), role(node, "time"));
    wireControls(item);
    wireDrag(item);
    return item;
  }

  function buildTrayCard(card) {
    const node = fromTemplate("tray-template");
    role(node, "title").textContent = describe(card);
    const facts = role(node, "facts");
    addFact(facts, "Card", card.id);
    addFact(facts, "Render host", card.host);
    addFact(facts, "Reason", card.reason || "No reason was recorded.");
    return node;
  }

  function show(state) {
    const list = byId("cards");
    const tray = byId("tray-cards");
    const saved = state.judgement && state.judgement.cards ? state.judgement : { order: [], cards: {} };
    const unrendered = [];
    state.cards.forEach((card) => {
      if (card.rendered) {
        const item = buildCard(card, state.judgement);
        rendered.push(item);
        list.appendChild(item.node);
      } else {
        tray.appendChild(buildTrayCard(card));
        unrendered.push(card.id);
        if (Object.prototype.hasOwnProperty.call(saved.cards, card.id)) { kept.cards[card.id] = saved.cards[card.id]; }
      }
    });
    // Their saved relative order first, then any saved card the order list did not name.
    const savedOrder = Array.isArray(saved.order) ? saved.order : [];
    const keptIds = Object.keys(kept.cards);
    kept.order = savedOrder.filter((id, i) => unrendered.includes(id) && savedOrder.indexOf(id) === i)
      .concat(keptIds.filter((id) => !savedOrder.includes(id)));
    byId("tray").hidden = tray.children.length === 0;
    renumber();
    wireDropTarget(list);
    setStatus(state.judgement ? "Your last saved judgement is shown." : "", false);
  }

  function isState(value) {
    return value !== null && typeof value === "object" && Array.isArray(value.cards);
  }

  // /state comes first: no card is drawn until the saved order, counts, stars and notes are known.
  fetch("/state").then((r) => {
    if (!r.ok) { throw new Error("status " + r.status); }
    return r.json();
  }).then((state) => {
    if (!isState(state)) { throw new Error("shape"); }
    show(state);
  }).catch(() => {
    fail("The cards could not be loaded. Reload the page to try again.");
  });

  document.addEventListener("visibilitychange", () => { if (document.hidden) { flush(); } });
  window.addEventListener("pagehide", flush);
}());
</script>
</body>
